version: '3.8'
services:
  agent:
    build: .
    container_name: react-agent
    ports:
      - '8502:8502'
    volumes:
      - ../prod_rag/data:/app/data
      - ../prod_rag/data/chroma_db:/app/chroma_db
    env_file:
      - .env
    command: streamlit run frontend/app.py --server.port 8502 --server.address 0.0.0.0
    restart: unless-stopped
